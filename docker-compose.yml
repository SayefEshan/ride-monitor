# Production stack for the VPS.
#
#   docker compose pull && docker compose up -d
#
# Two containers: the Next.js server, and Caddy in front of it. Caddy obtains
# and renews Let's Encrypt certificates on its own, which is why there is no
# certbot cron job to forget about.
#
# The app is never published to the host — only Caddy binds 80/443, and it
# reaches the app over the private compose network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ride_monitor
    # Sized for a 2 GB host shared with the Next server: ~300 rows of business
    # data needs no more, and the cap stops Postgres from starving the app.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=25
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      # migrate.sh runs inside this container at deploy time; both mounts are
      # read-only views of the checkout.
      - ./db/migrations:/migrations:ro
      - ./scripts:/scripts:ro
    # No ports: — reachable only on the internal compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ride_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    image: ${APP_IMAGE:-ghcr.io/sayefeshan/ride-monitor:latest}
    restart: unless-stopped
    # Must be `.env`: Compose reads only that filename when substituting
    # ${APP_DOMAIN} below, so any other name leaves Caddy without a domain.
    env_file: .env
    expose:
      - "3000"
    healthcheck:
      # The login page is public, so it answers without a session.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set APP_DOMAIN in .env; Caddy issues a certificate for it.
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # The business's entire database. scripts/backup-db.sh dumps it daily —
  # losing this volume without a backup is losing the books.
  pgdata:
  # Certificates live here. Losing this volume means re-issuing them, and
  # Let's Encrypt rate-limits that, so leave it alone.
  caddy_data:
  caddy_config:
