name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two deploys racing onto one server would interleave; queue them instead.
  # Never cancel mid-flight — a half-finished deploy is worse than a slow one.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Deploying an untested commit defeats the point of having CI, so the same
  # checks run first and a failure stops the deploy.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are set
        # These are inlined into the browser bundle, so a missing one produces
        # an image that builds fine and then fails for every user at runtime.
        # Better to stop here than to publish that.
        run: |
          missing=""
          [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] || missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -n "${{ secrets.VPS_HOST }}" ] || missing="$missing VPS_HOST"
          [ -n "${{ secrets.VPS_USER }}" ] || missing="$missing VPS_USER"
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || missing="$missing VPS_SSH_KEY"
          [ -n "${{ secrets.APP_DOMAIN }}" ] || missing="$missing APP_DOMAIN"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "Add them under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          echo "All required secrets are present."

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: meta
        # The registry rejects uppercase, and GitHub usernames may contain it.
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged with the commit sha as well as latest, so a bad deploy can
          # be rolled back to a known-good image by sha.
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # Inlined into the browser bundle at build time — see the Dockerfile.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Pull and restart on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN,APP_IMAGE
          # `set -e` below is what aborts on a failed command; the action's own
          # script_stop input was dropped in v1 and is ignored with a warning.
          script: |
            set -euo pipefail
            cd ~/ride-monitor

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans

            # Old images pile up and fill a small VPS disk.
            docker image prune -f
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin this deploy to the exact image just built, rather than whatever
          # :latest happens to point at by the time this runs.
          APP_IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}

      - name: Verify the site is answering
        # A deploy that silently serves errors is not a successful deploy.
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.APP_DOMAIN }}/login" || true)
            if [ "$code" = "200" ]; then echo "live (HTTP $code)"; exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "site did not return 200 after the deploy" >&2
          exit 1
