name: CI

on:
  pull_request:
  # Called by the deploy workflow, which gates the deploy on these checks.
  # There is deliberately no `push: main` trigger — that would run this twice
  # for every push, once here and once inside Deploy.
  workflow_call:
  # Lets you re-run the checks by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run irrelevant.
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # The schema and RLS suite needs a real Postgres. It stubs auth and
      # storage, so no Supabase project is involved.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        # PageProps/LayoutProps are globals that `next typegen` generates into
        # .next/types, which a fresh checkout does not have yet.
        run: npx next typegen && npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Install psql client
        # run-tests.sh drives dropdb/createdb/psql directly.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Schema and RLS tests
        run: npm run test:db

      - name: Build
        # Placeholders only. The build never contacts Supabase — every page
        # reads cookies and so renders dynamically — but next build still
        # needs the NEXT_PUBLIC_ vars to be defined.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
