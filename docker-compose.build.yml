# Overlay that builds the image on the server instead of pulling it from GHCR.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# This is what makes the very first deploy self-sufficient: no registry, no CI
# run, no GitHub secrets. Once the pipeline is wired up, pushes to main deliver
# a prebuilt image and this overlay is no longer needed.

services:
  app:
    build:
      context: .
      # Inlined into the browser bundle at build time, so they must be passed
      # here rather than left to run time. Values come from .env.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: ride-monitor:local
